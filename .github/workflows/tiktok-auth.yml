name: tiktok-login
on:
  workflow_dispatch:
    inputs:
      redirected_url: {description: "Step 2: paste the full URL you landed on (leave empty for step 1)", required: false, default: ""}
jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python src/auth_ci.py
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          REDIRECTED_URL: ${{ github.event.inputs.redirected_url }}
