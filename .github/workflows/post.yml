name: post-video
on:
  schedule: [{cron: "0 14,19 * * *"}]   # twice a day (UTC)
  workflow_dispatch:
    inputs:
      no_publish: {description: render only, type: boolean, default: true}
      format: {description: video format, type: choice, default: all, options: [all, random, facts, horror, howto]}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Fallback voice (Piper)
        run: |
          pip install piper-tts
          mkdir -p models && cd models
          B=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/lessac/medium
          curl -sSL -O $B/en_US-lessac-medium.onnx -O $B/en_US-lessac-medium.onnx.json
      - run: python src/main.py --format ${{ github.event.inputs.format || 'random' }} ${{ github.event.inputs.no_publish == 'true' && '--no-publish' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY || 'SELF_ONLY' }}
      - uses: actions/upload-artifact@v4
        with: {name: video, path: out/*.mp4}
      - name: remember used topics
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add history.json && git commit -m "history" && git push || true
