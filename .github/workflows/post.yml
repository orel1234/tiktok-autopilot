name: post-video
on:
  # Inbox mode: drafts arrive in the TikTok app at 16:00 and 19:00 Israel time (14:00/17:00 UTC); you tap Post.
  # After the app is approved for Direct Post, switch to US evening: "0 23,2 * * *" and post_mode direct.
  schedule: [{cron: "0 14,17 * * *"}]
  workflow_dispatch:
    inputs:
      no_publish: {description: "test only: render, do not post", type: boolean, default: false}
      format: {description: video format, type: choice, default: horror, options: [horror, all, random, facts, howto]}
      post_mode: {description: 'inbox = send to TikTok drafts, direct = post automatically', type: choice, default: inbox, options: [inbox, direct]}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/cache@v4
        with: {path: models, key: piper-en_US-lessac-medium}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Fallback voice (Piper)
        run: |
          pip install piper-tts
          mkdir -p models && cd models
          B=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/lessac/medium
          [ -s en_US-lessac-medium.onnx ] || curl -sSL -O $B/en_US-lessac-medium.onnx -O $B/en_US-lessac-medium.onnx.json
      - run: python src/main.py --format ${{ github.event.inputs.format || 'random' }} ${{ github.event.inputs.no_publish == 'true' && '--no-publish' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY || 'SELF_ONLY' }}
          TIKTOK_POST_MODE: ${{ github.event.inputs.post_mode || vars.TIKTOK_POST_MODE || 'inbox' }}
      - uses: actions/upload-artifact@v4
        with: {name: video, path: out/*.mp4}
      - name: remember used topics
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A && git commit -m "state" && git push || true
